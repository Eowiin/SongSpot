# Local development only.
#
# Production is a single VPS running systemd units — daphne, Postgres and Redis
# on the host, catalogue jobs on timers. See docs/DEPLOYMENT_GUIDE.md. Nothing
# in this file is used there, and it is not a description of prod.
#
#   docker compose up --build
#
services:
  backend:
    build: &backend_build
      context: .
      dockerfile: songspot_backend/Dockerfile
    container_name: songspot_backend_dev
    working_dir: /app/songspot_backend
    command: sh -c "python manage.py migrate && python manage.py search_backfill && python manage.py search_health && python manage.py collectstatic --noinput && exec daphne -b 0.0.0.0 -p 8000 songspot.asgi:application"
    environment: &backend_environment
      DJANGO_SECRET_KEY: docker-dev-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: '*'
      # Postgres rather than the sqlite default, and the same major version as
      # the VPS. Search runs on pg_trgm + GIN indexes, which sqlite has neither
      # of, so on sqlite those migrations are skipped and the query they exist
      # for is never exercised — which is how 0011 and 0014 both reached prod
      # with a CREATE INDEX that only fails on Postgres.
      DATABASE_URL: postgres://songspot:songspot@db:5432/songspot
      SEARCH_BACKEND: postgres
      SEARCH_INDEX_ENABLED: "False"
      SEARCH_ENRICHMENT_ENABLED: "${SEARCH_ENRICHMENT_ENABLED:-True}"
      # Redis backs the websocket channel layer and the Django cache.
      USE_REDIS_CHANNEL_LAYER: "True"
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/1
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "8000:8000"
    volumes:
      - ./songspot_backend:/app/songspot_backend
    stdin_open: true
    tty: true
    # Daphne only listens once migrations, backfill and readiness checks pass.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 30m
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  search-worker:
    build: *backend_build
    working_dir: /app/songspot_backend
    command: python manage.py search_worker
    environment: *backend_environment
    volumes:
      - ./songspot_backend:/app/songspot_backend
    depends_on:
      backend:
        condition: service_healthy

  db:
    # Matches the VPS, which runs PostgreSQL 16.
    image: postgres:16-alpine
    container_name: songspot_db_dev
    environment:
      POSTGRES_USER: songspot
      POSTGRES_PASSWORD: songspot
      POSTGRES_DB: songspot
    ports:
      # 5433 by default: a developer machine usually already has a Postgres on
      # 5432. Override with DB_PORT if that one is taken too.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # The backend runs migrations on startup, so it must not race the cluster.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songspot -d songspot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Matches the VPS, which runs Redis 7.
    image: redis:7-alpine
    container_name: songspot_redis_dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
