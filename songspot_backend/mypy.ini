[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
exclude = (^\.venv/|/migrations/)
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

[mypy.plugins.django-stubs]
django_settings_module = songspot.settings

# Third-party packages that ship no type information.
[mypy-axes.*,firebase_admin.*,google.*,channels.*,channels_redis.*,daphne.*,dotenv.*,corsheaders.*,ratelimit.*,sentry_sdk.*,dj_database_url.*,rest_framework_simplejwt.*,cachecontrol.*,redis.*]
ignore_missing_imports = True
