<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SongSpot{% endblock %}</title>
  <meta name="description" content="SongSpot: multiplayer music guessing game.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6c63ff;
      --primary-soft: #9d5cff;
      --secondary: #ff6584;
      --accent: #4ecdc4;
      --bg-top: #1a1a2e;
      --bg-bottom: #0f0f1e;
      --surface: #16213e;
      --surface-soft: #1e2a4a;
      --text: #ffffff;
      --muted: #b0b0b0;
      --line: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(80px);
      opacity: 0.28;
    }

    body::before {
      width: 360px;
      height: 360px;
      top: -120px;
      right: -80px;
      background: var(--secondary);
    }

    body::after {
      width: 460px;
      height: 460px;
      bottom: -180px;
      left: -120px;
      background: var(--accent);
    }

    .site {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .topbar-wrap {
      border-bottom: 1px solid var(--line);
      background: rgba(10, 14, 29, 0.55);
      backdrop-filter: blur(10px);
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text);
      text-decoration: none;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0.08rem;
      line-height: 1.1;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 0.44rem 0.88rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.87rem;
      background: rgba(255, 255, 255, 0.03);
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .nav-link:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .nav-link.active {
      color: var(--text);
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      box-shadow: 0 10px 20px rgba(108, 99, 255, 0.35);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.35rem 0 2rem;
      animation: page-in 250ms ease-out;
    }

    h1, h2, h3 {
      margin: 0;
      line-height: 1.2;
      color: var(--text);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: clamp(1.24rem, 3.2vw, 1.7rem);
      font-weight: 700;
    }

    h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.97rem;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: clamp(320px, 56vh, 560px);
      border-radius: 24px;
      border: 1px solid var(--line);
      background:
        linear-gradient(160deg, rgba(108, 99, 255, 0.26), rgba(255, 101, 132, 0.18)),
        linear-gradient(155deg, rgba(22, 33, 62, 0.98), rgba(26, 26, 46, 0.96));
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .hero-full {
      min-height: calc(100vh - 180px);
    }

    .hero::before {
      content: "";
      position: absolute;
      right: -80px;
      top: -70px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(78, 205, 196, 0.82) 0%, rgba(78, 205, 196, 0) 70%);
      opacity: 0.55;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: clamp(1.2rem, 3.6vw, 2.2rem);
    }

    .hero-copy {
      max-width: 700px;
      display: grid;
      gap: 1rem;
    }

    .eyebrow {
      width: fit-content;
      padding: 0.32rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.72rem;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.06);
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.45rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 0.66rem 1.05rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease, color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: var(--text);
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      box-shadow: 0 10px 24px rgba(108, 99, 255, 0.36);
    }

    .btn-secondary {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.05);
    }

    .section {
      width: 100%;
      margin-top: 1rem;
      padding: 1.05rem;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, var(--surface), var(--surface-soft));
      box-shadow: var(--card-shadow);
    }

    .section-head {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .tile {
      padding: 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      min-height: 100%;
    }

    .tile p {
      font-size: 0.93rem;
    }

    ul {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 0.32rem;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.62;
    }

    a {
      color: #8cbeff;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.83rem;
      padding: 0.14rem 0.34rem;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .footer {
      width: 100%;
      margin-top: auto;
      border-top: 1px solid var(--line);
      background: rgba(9, 12, 26, 0.5);
    }

    .footer-inner {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .footer-links {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
    }

    .footer-links a {
      color: #8cbeff;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer strong {
      color: var(--text);
      font-weight: 600;
    }

    @keyframes page-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 780px) {
      .container {
        width: min(1120px, calc(100% - 1rem));
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        min-height: clamp(340px, 62vh, 600px);
      }

      .hero-full {
        min-height: clamp(420px, 72vh, 780px);
      }

      .hero-inner {
        align-items: flex-start;
        padding: 1.1rem;
      }

      .actions .btn {
        width: 100%;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 0.7rem 0;
      }
    }
  </style>
</head>
<body>
  <div class="site">
    <div class="topbar-wrap">
      <header class="topbar container">
        <a href="/" class="brand">
          <img src="/logo.png" alt="SongSpot logo" class="brand-logo">
          <span class="brand-text">
            <span class="brand-title">SongSpot</span>
            <span class="brand-subtitle">Guess the song</span>
          </span>
        </a>
        <nav class="nav" aria-label="Main navigation">
          <a class="nav-link{% if active_page == 'home' %} active{% endif %}" href="/">Home</a>
          <a class="nav-link{% if active_page == 'privacy' %} active{% endif %}" href="/privacy">Privacy</a>
          <a class="nav-link{% if active_page == 'support' %} active{% endif %}" href="/support">Support</a>
          <a class="nav-link{% if active_page == 'terms' %} active{% endif %}" href="/terms">Terms</a>
          <a class="nav-link{% if active_page == 'account' %} active{% endif %}" href="/account">Account</a>
        </nav>
      </header>
    </div>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="footer-inner container">
        <span><strong>SongSpot</strong> &copy; {% now "Y" %}</span>
        <span class="footer-links">
          <a href="/privacy">Privacy</a>
          <a href="/support">Support</a>
          <a href="/terms">Terms</a>
          <a href="/account">Account</a>
        </span>
      </div>
    </footer>
  </div>
</body>
</html>
