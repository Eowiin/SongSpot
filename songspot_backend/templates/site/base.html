<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SongSpot{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}SongSpot is a music guessing game. One second of a track, three lives, fourteen genres. Play free in your browser or on iOS and Android.{% endblock %}">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" type="image/png" href="/logo.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SongSpot">
  <meta property="og:title" content="{% block og_title %}SongSpot — guess the song in one second{% endblock %}">
  <meta property="og:description" content="One second of a track. Three lives. Fourteen genres. Play free in your browser.">
  <meta property="og:image" content="/logo.png">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ---------------------------------------------------------------
       Palette is the app's (lib/config/app_theme.dart) — do not drift.
       Primary #6C63FF · Secondary #FF6584 · Accent #4ECDC4
       --------------------------------------------------------------- */
    :root {
      --primary: #6c63ff;
      --secondary: #ff6584;
      --accent: #4ecdc4;

      --bg: #1a1a2e;
      --bg-deep: #101020;
      --surface: #16213e;

      --ink: #ffffff;
      --ink-2: #c6c3de;
      --ink-3: #8b88ab;

      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.22);

      --gutter: clamp(1.25rem, 5vw, 4rem);
      --band: clamp(3.5rem, 9vw, 7rem);
      --maxw: 1240px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Layout ------------------------------------------------------- */

    .wrap {
      width: 100%;
      max-width: var(--maxw);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .band {
      padding-block: var(--band);
      border-top: 1px solid var(--line);
    }

    .band--deep { background: var(--bg-deep); }
    .band--tight { padding-block: clamp(2.25rem, 5vw, 3.5rem); }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 99;
      padding: 0.75rem 1.1rem;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }
    .skip-link:focus { left: 0; }

    /* Type --------------------------------------------------------- */

    h1, h2, h3, h4 { margin: 0; color: var(--ink); }

    .display {
      font-weight: 900;
      font-size: clamp(2.9rem, 9.2vw, 6.6rem);
      line-height: 0.88;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    .display .tint { color: var(--accent); }
    .display .tint-2 { color: var(--secondary); }

    .title {
      font-weight: 800;
      font-size: clamp(1.9rem, 4.6vw, 3.1rem);
      line-height: 1.0;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .subtitle {
      font-weight: 700;
      font-size: clamp(1.05rem, 2vw, 1.28rem);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .kicker {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--accent);
      margin-bottom: 1.1rem;
    }

    .kicker--pink { color: var(--secondary); }
    .kicker--violet { color: var(--primary); }

    p { margin: 0; color: var(--ink-2); }
    p + p { margin-top: 0.9rem; }

    .lede {
      font-size: clamp(1.02rem, 1.7vw, 1.17rem);
      line-height: 1.65;
      max-width: 46ch;
    }

    .muted { color: var(--ink-3); }
    .small { font-size: 0.88rem; line-height: 1.6; }

    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--ink); }

    ul { margin: 0; padding: 0; list-style: none; }

    .list li {
      position: relative;
      padding-left: 1.5rem;
      color: var(--ink-2);
      line-height: 1.65;
    }
    .list li + li { margin-top: 0.55rem; }
    .list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.72em;
      width: 8px;
      height: 2px;
      background: var(--accent);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84em;
      padding: 0.15rem 0.4rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    /* Buttons ------------------------------------------------------ */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.95rem 1.6rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #7d76ff; color: #fff; }

    .btn-ghost { border-color: var(--line-strong); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(255, 255, 255, 0.04); }

    .btn-sm { padding: 0.62rem 1.05rem; font-size: 0.72rem; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    /* Header ------------------------------------------------------- */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(26, 26, 46, 0.92);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      min-height: 72px;
      padding-block: 0.85rem;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--ink);
      flex-shrink: 0;
    }

    .wordmark img {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: block;
    }

    .wordmark span {
      font-weight: 900;
      font-size: 1.02rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .wordmark .dot { color: var(--accent); }

    .nav {
      display: flex;
      align-items: center;
      gap: 1.6rem;
      margin-left: auto;
    }

    .nav a {
      position: relative;
      color: var(--ink-3);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding-block: 0.35rem;
      transition: color 140ms ease;
    }

    .nav a:hover { color: var(--ink); }

    /* .nav a would otherwise win on specificity and grey out the button. */
    .nav a.btn-primary,
    .nav a.btn-primary:hover { color: #fff; }

    .nav a.active { color: var(--ink); }
    .nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.1rem;
      height: 2px;
      background: var(--accent);
    }

    /* Marquee ------------------------------------------------------ */

    .marquee {
      overflow: hidden;
      border-block: 1px solid var(--line);
      background: var(--bg-deep);
      padding-block: 0.9rem;
      user-select: none;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 42s linear infinite;
    }

    .marquee-group {
      display: flex;
      align-items: center;
      gap: 2.2rem;
      padding-right: 2.2rem;
      white-space: nowrap;
      font-weight: 800;
      font-size: 0.86rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .marquee-group i {
      font-style: normal;
      color: var(--accent);
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* Footer ------------------------------------------------------- */

    .site-footer {
      border-top: 1px solid var(--line);
      background: var(--bg-deep);
      padding-block: clamp(2.5rem, 5vw, 3.5rem);
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
    }

    .footer-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.4rem;
    }

    .footer-nav a {
      color: var(--ink-3);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .footer-nav a:hover { color: var(--ink); }

    .footer-bottom {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--ink-3);
      font-size: 0.8rem;
    }

    /* Page header (inner pages) ------------------------------------ */

    .page-head {
      padding-block: clamp(3rem, 7vw, 5.5rem) clamp(2rem, 4vw, 3rem);
    }

    .page-head .display { font-size: clamp(2.4rem, 6.4vw, 4.6rem); }
    .page-head .lede { margin-top: 1.6rem; }

    .stamp {
      display: inline-block;
      margin-top: 1.4rem;
      padding: 0.32rem 0.7rem;
      border: 1px solid var(--line-strong);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* Editorial columns -------------------------------------------- */

    .cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: clamp(1.75rem, 4vw, 3.25rem);
    }

    .cols--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

    .col h3 {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding-bottom: 0.85rem;
      margin-bottom: 1.1rem;
      border-bottom: 1px solid var(--line);
    }

    .col--rule { padding-top: 1.6rem; border-top: 2px solid var(--accent); }
    .col--rule.is-pink { border-top-color: var(--secondary); }
    .col--rule.is-violet { border-top-color: var(--primary); }

    .section-head { margin-bottom: clamp(2.25rem, 5vw, 3.5rem); }
    .section-head .lede { margin-top: 1.1rem; }

    /* Reduced motion ----------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .marquee-track { animation: none; }
    }

    /* Responsive --------------------------------------------------- */

    @media (max-width: 820px) {
      .header-inner { min-height: 64px; }
      .nav { gap: 1.05rem; }
      .nav a { font-size: 0.74rem; letter-spacing: 0.03em; }
      .nav .nav-hide { display: none; }
      .btn-row .btn { flex: 1 1 auto; }
    }

    @media (max-width: 560px) {
      /* At 320px the header ran off the edge and clipped the Play button.
         The wordmark is already the link home, so the Home item goes first. */
      :root { --gutter: 1rem; }

      .nav { gap: 0.7rem; }
      .nav .nav-hide-sm { display: none; }

      .wordmark img { width: 26px; height: 26px; }
      .wordmark span { font-size: 0.86rem; letter-spacing: 0.09em; }

      .btn-sm { padding: 0.55rem 0.8rem; font-size: 0.68rem; }
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="wordmark" aria-label="SongSpot home">
        <img src="/logo.png" alt="">
        <span>SongSpot<span class="dot">.</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a class="nav-hide-sm{% if active_page == 'home' %} active{% endif %}" href="/">Home</a>
        <a href="/support"{% if active_page == 'support' %} class="active"{% endif %}>Support</a>
        <a class="nav-hide{% if active_page == 'account' %} active{% endif %}" href="/account">Account</a>
        <a class="nav-hide{% if active_page == 'privacy' %} active{% endif %}" href="/privacy">Privacy</a>
        <a class="btn btn-primary btn-sm" href="{{ play_url }}">Play</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-grid">
        <div>
          <a href="/" class="wordmark" aria-label="SongSpot home">
            <img src="/logo.png" alt="">
            <span>SongSpot<span class="dot">.</span></span>
          </a>
          <p class="small muted" style="margin-top: 0.9rem; max-width: 30ch;">
            A music guessing game. One second of a track is usually enough.
          </p>
        </div>
        <nav class="footer-nav" aria-label="Footer">
          <a href="{{ play_url }}">Play</a>
          <a href="/support">Support</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/account">Account</a>
        </nav>
      </div>
      <div class="footer-bottom">
        <span>&copy; {% now "Y" %} SongSpot — Eowin Studio</span>
        <a href="mailto:{{ support_email }}">{{ support_email }}</a>
      </div>
    </div>
  </footer>
</body>
</html>
