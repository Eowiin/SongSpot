name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "songspot_backend/**"
      - "songspot_mobile/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "songspot_backend/**"
      - "songspot_mobile/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      mobile: ${{ steps.check.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi
          echo "$CHANGED"
          echo "backend=$(echo "$CHANGED" | grep -qE '^(songspot_backend/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "mobile=$(echo "$CHANGED" | grep -qE '^(songspot_mobile/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT

  backend:
    name: Backend Tests and Ruff
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: songspot_backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "True"
      DATABASE_URL: sqlite:////tmp/songspot_ci.sqlite3
      USE_REDIS_CHANNEL_LAYER: "False"
      CHANNEL_LAYERS_REDIS_URL: ""
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      FCM_SERVICE_ACCOUNT_PATH: ""
      FCM_SERVICE_ACCOUNT_JSON: ""
      SENTRY_DSN: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: songspot_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff
        run: ruff check . --config ruff.toml

      - name: Django tests
        run: python manage.py test --verbosity 1

  mobile:
    name: Flutter Test and Analyze
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: songspot_mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Create .env placeholder
        run: touch .env

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test
