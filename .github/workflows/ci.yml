name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "songspot_backend/**"
      - "songspot_mobile/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "songspot_backend/**"
      - "songspot_mobile/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests and Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: songspot_backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "True"
      DATABASE_URL: sqlite:////tmp/songspot_ci.sqlite3
      USE_REDIS_CHANNEL_LAYER: "False"
      CHANNEL_LAYERS_REDIS_URL: ""
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      FCM_SERVICE_ACCOUNT_PATH: ""
      FCM_SERVICE_ACCOUNT_JSON: ""
      SENTRY_DSN: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: songspot_backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff
        run: ruff check . --config ruff.toml

      - name: Django tests
        run: python manage.py test --verbosity 1

  mobile:
    name: Flutter Test and Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: songspot_mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Create .env placeholder
        run: touch .env

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test
