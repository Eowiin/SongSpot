name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "songspot_backend/**"
      - "docker-compose.yml"
      - "scripts/deploy_backend.sh"

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          for variable in VPS_HOST VPS_USER VPS_APP_DIR; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure known hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -n "${VPS_HOST_KEY:-}" ]; then
            echo "${VPS_HOST_KEY}" >> ~/.ssh/known_hosts
            exit 0
          fi

          port="${VPS_PORT:-22}"
          ssh-keyscan -p "${port}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Pull latest code and deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_DEPLOY_SCRIPT: ${{ secrets.VPS_DEPLOY_SCRIPT }}
        run: |
          set -euo pipefail

          port="${VPS_PORT:-22}"
          deploy_script="${VPS_DEPLOY_SCRIPT:-scripts/deploy_backend.sh}"

          ssh -p "${port}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_APP_DIR}'
            git fetch --prune origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x '${deploy_script}'
            '${deploy_script}'
          "
