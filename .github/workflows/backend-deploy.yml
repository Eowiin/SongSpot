name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "songspot_backend/**"
      - "docker-compose.yml"
      - "scripts/deploy_backend.sh"
      - "scripts/deploy_support.py"
      - "scripts/systemd/songspot-search-worker.service"
      - ".github/workflows/backend-deploy.yml"

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test deployment orchestration
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          for variable in VPS_HOST VPS_USER VPS_APP_DIR; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure known hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -n "${VPS_HOST_KEY:-}" ]; then
            echo "${VPS_HOST_KEY}" >> ~/.ssh/known_hosts
            exit 0
          fi

          port="${VPS_PORT:-22}"
          ssh-keyscan -p "${port}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare and deploy the exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_DEPLOY_SCRIPT: ${{ secrets.VPS_DEPLOY_SCRIPT }}
        run: |
          set -euo pipefail

          port="${VPS_PORT:-22}"
          deploy_script="${VPS_DEPLOY_SCRIPT:-scripts/deploy_backend.sh}"

          # Execute the new orchestrator from stdin. It stops existing writers
          # before updating the live checkout, and locks the whole deployment.
          test -f "${deploy_script}"
          printf -v remote_command 'bash -s -- %q %q' "${VPS_APP_DIR}" "${GITHUB_SHA}"
          ssh -p "${port}" "${VPS_USER}@${VPS_HOST}" "${remote_command}" < "${deploy_script}"
